<h2>Products</h2>

<div>
  <input [(ngModel)]="newProductName" placeholder="Product name">
  <input [(ngModel)]="newProductPrice" type="number" placeholder="Price">
  <button (click)="addProduct()">Add Product</button>
</div>

<div *ngFor="let product of products; let i = index" class="product-card">
  {{ product.name }} - {{ product.price }}
  <button (click)="deleteProduct(i)">Delete</button>
</div>
